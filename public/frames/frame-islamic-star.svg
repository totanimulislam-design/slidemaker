<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" preserveAspectRatio="none">
  <!-- Islamic Star Band: eight-pointed khatam stars on a deep teal mat -->
  <defs>
    <pattern id="khatam" width="48" height="48" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#f6e27a" stroke-width="2">
        <rect x="13" y="13" width="22" height="22"/>
        <rect x="13" y="13" width="22" height="22" transform="rotate(45 24 24)"/>
      </g>
      <circle cx="24" cy="24" r="3.5" fill="#f6e27a"/>
      <circle cx="0" cy="0" r="3" fill="#d4af37" opacity=".7"/>
      <circle cx="48" cy="48" r="3" fill="#d4af37" opacity=".7"/>
    </pattern>
    <g id="ring"><path d="M0 0h1280v720H0zM64 58h1152v604H64z" fill-rule="evenodd"/></g>
  </defs>
  <use href="#ring" xlink:href="#ring" fill="#083b32"/>
  <use href="#ring" xlink:href="#ring" fill="url(#khatam)"/>
  <rect x="10" y="8" width="1260" height="704" fill="none" stroke="#d4af37" stroke-width="5"/>
  <rect x="30" y="26" width="1220" height="668" fill="none" stroke="#0e5c4c" stroke-width="6"/>
  <rect x="52" y="48" width="1176" height="624" fill="none" stroke="#f6e27a" stroke-width="2"/>
</svg>
