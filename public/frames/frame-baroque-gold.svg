<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" preserveAspectRatio="none">
  <!-- Baroque Gold: bevelled gilt band with beading and corner rosettes -->
  <defs>
    <linearGradient id="gilt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff6c9"/><stop offset="30%" stop-color="#e6b800"/>
      <stop offset="62%" stop-color="#8c6b00"/><stop offset="100%" stop-color="#ffe082"/>
    </linearGradient>
    <pattern id="bead" width="46" height="46" patternUnits="userSpaceOnUse">
      <circle cx="23" cy="23" r="4.5" fill="#fff6c9" opacity=".9"/>
    </pattern>
    <g id="ring"><path d="M0 0h1280v720H0zM86 74h1108v572H86z" fill-rule="evenodd"/></g>
    <g id="rosette">
      <circle r="22" fill="#8c6b00"/>
      <circle r="22" fill="none" stroke="#fff6c9" stroke-width="2.5"/>
      <circle r="10" fill="url(#gilt)"/>
      <g fill="#fff6c9">
        <path d="M0 -34l6 12-6 6-6-6z"/><path d="M0 34l6-12-6-6-6 6z"/>
        <path d="M-34 0l12 6 6-6-6-6z"/><path d="M34 0l-12 6-6-6 6-6z"/>
      </g>
    </g>
  </defs>
  <use href="#ring" xlink:href="#ring" fill="url(#gilt)"/>
  <use href="#ring" xlink:href="#ring" fill="url(#bead)"/>
  <rect x="10" y="8" width="1260" height="704" fill="none" stroke="#7a5a00" stroke-width="8"/>
  <rect x="34" y="30" width="1212" height="660" fill="none" stroke="#fff6c9" stroke-width="3"/>
  <rect x="74" y="64" width="1132" height="592" fill="none" stroke="#8c6b00" stroke-width="7"/>
  <g>
    <use href="#rosette" xlink:href="#rosette" transform="translate(43,39)"/>
    <use href="#rosette" xlink:href="#rosette" transform="translate(1237,39)"/>
    <use href="#rosette" xlink:href="#rosette" transform="translate(43,681)"/>
    <use href="#rosette" xlink:href="#rosette" transform="translate(1237,681)"/>
  </g>
</svg>
