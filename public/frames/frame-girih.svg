<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" preserveAspectRatio="none">
  <!-- Girih Interlace: circle-derived strapwork on a deep indigo mat -->
  <defs>
    <pattern id="girih" width="52" height="52" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#e9d5a0" stroke-width="2" opacity=".9">
        <circle cx="0" cy="0" r="26"/><circle cx="52" cy="0" r="26"/>
        <circle cx="0" cy="52" r="26"/><circle cx="52" cy="52" r="26"/>
        <circle cx="26" cy="26" r="26"/>
      </g>
      <circle cx="26" cy="26" r="3" fill="#d4af37"/>
    </pattern>
    <g id="ring"><path d="M0 0h1280v720H0zM68 62h1144v596H68z" fill-rule="evenodd"/></g>
  </defs>
  <use href="#ring" xlink:href="#ring" fill="#1e1b4b"/>
  <use href="#ring" xlink:href="#ring" fill="url(#girih)"/>
  <rect x="10" y="8" width="1260" height="704" fill="none" stroke="#d4af37" stroke-width="6"/>
  <rect x="34" y="30" width="1212" height="660" fill="none" stroke="#4c1d95" stroke-width="8"/>
  <rect x="56" y="52" width="1168" height="616" fill="none" stroke="#e9d5a0" stroke-width="2.5"/>
</svg>
