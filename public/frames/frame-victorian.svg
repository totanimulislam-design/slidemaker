<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" preserveAspectRatio="none">
  <!-- Victorian: mahogany mat with cream rules and filigree corner arcs -->
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7b3f1d"/><stop offset="50%" stop-color="#4a2411"/><stop offset="100%" stop-color="#7b3f1d"/>
    </linearGradient>
    <g id="ring"><path d="M0 0h1280v720H0zM80 70h1120v580H80z" fill-rule="evenodd"/></g>
    <g id="fil">
      <g fill="none" stroke="#f3e2c7" stroke-width="3" stroke-linecap="round">
        <path d="M6 62 C6 30 30 6 62 6"/>
        <path d="M20 62 C20 38 38 20 62 20"/>
        <path d="M34 58 C34 44 44 34 58 34"/>
      </g>
      <circle cx="14" cy="14" r="5" fill="#f3e2c7"/>
    </g>
  </defs>
  <use href="#ring" xlink:href="#ring" fill="url(#wood)"/>
  <rect x="10" y="8" width="1260" height="704" fill="none" stroke="#2c1409" stroke-width="8"/>
  <rect x="36" y="32" width="1208" height="656" fill="none" stroke="#f3e2c7" stroke-width="3"/>
  <rect x="68" y="60" width="1144" height="600" fill="none" stroke="#c8935a" stroke-width="2"/>
  <g>
    <use href="#fil" xlink:href="#fil" transform="translate(12,10)"/>
    <use href="#fil" xlink:href="#fil" transform="translate(1268,10) scale(-1,1)"/>
    <use href="#fil" xlink:href="#fil" transform="translate(12,710) scale(1,-1)"/>
    <use href="#fil" xlink:href="#fil" transform="translate(1268,710) scale(-1,-1)"/>
  </g>
</svg>
