  <rect x="18" y="16" width="1244" height="688" fill="none" stroke="#7f1d1d" stroke-width="7"/>
  <rect x="36" y="32" width="1208" height="656" fill="none" stroke="#a83232" stroke-width="2"/>
  <g>
    <use href="#quatre" xlink:href="#quatre" transform="translate(36,32)"/>
    <use href="#quatre" xlink:href="#quatre" transform="translate(1244,32)"/>
