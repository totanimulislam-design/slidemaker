<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" preserveAspectRatio="none">
  <!-- Fleur: burgundy double rule with gold quatrefoil corner motifs -->
  <defs>
    <g id="quatre">
      <g fill="#d4af37">
        <circle cx="0" cy="-13" r="11"/>
        <circle cx="0" cy="13" r="11"/>
        <circle cx="-13" cy="0" r="11"/>
        <circle cx="13" cy="0" r="11"/>
      </g>
      <path d="M0 -9 L9 0 L0 9 L-9 0 Z" fill="#7f1d1d"/>
    </g>
    <g id="dot"><circle r="4" fill="#d4af37"/></g>
